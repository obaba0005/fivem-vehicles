<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FiveM車両ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="karu.jpg">
<style>
  :root{
    --bg:#fff6fa;
    --panel:#ffffff;
    --panel2:#ffeef5;
    --line:#f3c3d8;
    --ink:#33232e;
    --text:#33232e;
    --sub:#9a6f87;
    --accent:#ff5da2;
    --accent2:#ff8f3d;
    --accent-text:#ffffff;
    --price:#00a86b;
    --danger:#ff5c8a;
    --sunset1:#ff9ecf;
    --sunset2:#c9a7ff;
    --sunset3:#8fd3ff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:linear-gradient(180deg,#ffd3e8 0%,#e6c9ff 45%,#bcd9ff 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:"Zen Maru Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  header{
    padding:20px 24px 12px;
    max-width:1100px;
    margin:0 auto;
  }
  .hero{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    border:3px solid var(--ink);
    border-radius:24px;
    background:var(--sunset2) url("banner.png") center 78%/cover;
    min-height:210px;
    box-shadow:0 8px 0 rgba(51,35,46,.9),0 16px 32px rgba(255,93,162,.25);
    padding:26px 24px 22px;
    margin-bottom:18px;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,0) 30%,rgba(255,246,250,.55));
    pointer-events:none;
  }
  .hero > *{position:relative;z-index:1;}
  .hero-text{flex:1;min-width:0;}
  .hero-mascot{
    flex:none;
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid var(--ink);
    background:#f5a623;
    box-shadow:0 4px 0 rgba(51,35,46,.9);
  }
  @media (max-width:640px){
    .hero-mascot{width:76px;height:76px;}
    .hero{padding:20px 16px 16px;}
  }
  .hero-tag{
    display:inline-block;
    font-family:Anton,"Zen Maru Gothic",sans-serif;
    letter-spacing:.28em;
    font-size:13px;
    color:#fff;
    background:var(--ink);
    border-radius:999px;
    padding:5px 14px 4px;
    margin-bottom:10px;
  }
  h1{
    font-family:Anton,"Zen Maru Gothic",sans-serif;
    font-size:clamp(28px,5vw,44px);
    line-height:1.1;
    letter-spacing:.02em;
    color:#fff;
    margin:0 0 6px;
    text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink),0 6px 0 rgba(51,35,46,.25);
  }
  .subtitle{color:#fff;font-size:15px;font-weight:700;margin:0;text-shadow:1px 2px 0 rgba(51,35,46,.55);}
  .banner{
    display:none;
    background:#fff3bf;
    color:#7c4a03;
    border:2px solid var(--ink);
    border-radius:999px;
    padding:10px 14px;
    margin:0 0 16px;
    font-size:14px;
    font-weight:700;
  }
  .banner.show{display:block;}
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:16px;
  }
  .toolbar input[type="search"], .toolbar select{
    background:#fff;
    color:var(--text);
    border:2px solid var(--ink);
    border-radius:999px;
    padding:10px 14px;
    font-size:14px;
    font-family:inherit;
    font-weight:700;
    outline:none;
    box-shadow:0 3px 0 rgba(51,35,46,.9);
  }
  .toolbar input[type="search"]{flex:1;min-width:200px;}
  .toolbar select{min-width:170px;}
  button{
    cursor:pointer;
    border:2px solid var(--ink);
    border-radius:999px;
    padding:10px 18px;
    font-size:14px;
    font-family:inherit;
    font-weight:900;
    box-shadow:0 3px 0 var(--ink);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button:hover{transform:translateY(-1px);}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-text);}
  #add-button{flex:none;padding:13px 24px;font-size:15px;}
  .btn-secondary{background:#fff;color:var(--text);}
  .btn-danger{background:var(--danger);color:#fff;}
  .count{display:inline-block;color:var(--ink);font-size:14px;font-weight:900;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;margin:0 0 16px;box-shadow:0 3px 0 rgba(51,35,46,.9);}
  main{max-width:1100px;margin:0 auto;padding:0 24px 40px;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:16px;
  }
  .card{
    background:var(--panel);
    border:3px solid var(--ink);
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 6px 0 rgba(51,35,46,.9),0 12px 24px rgba(255,93,162,.18);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 10px 0 rgba(51,35,46,.9),0 16px 28px rgba(255,93,162,.25);}
  .modal-panel.detail-panel{max-width:720px;}
  .detail-image{
    aspect-ratio:16/9;
    background:#ffeef5;
    border-radius:8px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:16px;
  }
  .detail-image img{width:100%;height:100%;object-fit:contain;display:block;}
  .detail-image .no-image{color:var(--sub);font-size:14px;}
  .detail-name{font-size:22px;font-weight:900;margin:0 0 8px;word-break:break-word;}
  .detail-price{color:var(--price);font-weight:900;font-size:18px;margin:0 0 8px;}
  .card-image{
    aspect-ratio:16/9;
    background:#ffeef5;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .card-image img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-image .no-image{color:var(--sub);font-size:13px;}
  .card-body{padding:14px;}
  .card-name{font-size:16px;font-weight:900;margin:0 0 6px;word-break:break-word;}
  .category-badge{
    display:inline-block;
    background:var(--panel2);
    border:2px solid var(--ink);
    color:var(--ink);
    font-size:12px;
    font-weight:900;
    border-radius:999px;
    padding:2px 10px;
    margin:0 0 8px;
  }
  .cat-車{background:#ffe3ef;color:#c2255c;}
  .cat-バイク{background:#dbeafe;color:#1971c2;}
  .cat-ヘリ{background:#c3fae8;color:#087f5b;}
  .cat-飛行機{background:#fff3bf;color:#e67700;}
  .cat-船{background:#e5dbff;color:#6741d9;}
  .cat-バニラ車{background:#e9ecef;color:#495057;}
  .cat-カーディーラー{background:#c5f6fa;color:#0b7285;}
  .cat-高級車{background:#ffec99;color:#7a4a00;}
  .genre-コンパクト{background:#ffe8cc;color:#d9480f;}
  .genre-セダン{background:#d3f9d8;color:#2b8a3e;}
  .genre-バイク{background:#d0bfff;color:#5f3dc4;}
  .genre-オフロード{background:#f0e0c8;color:#8a5a00;}
  .genre-バン{background:#dbe4ff;color:#364fc7;}
  .genre-ネタ車両{background:#fff0f6;color:#d6336c;}
  .genre-スポーツ{background:#ffe3e3;color:#c92a2a;}
  .genre-サイクル{background:#c3fae8;color:#087f5b;}
  .genre-スーパーカー{background:#fff3bf;color:#e67700;}
  .genre-マッスルカー{background:#f3d9fa;color:#862e9c;}
  .genre-SUV{background:#c5f6fa;color:#0b7285;}
  .genre-トラック{background:#e9ecef;color:#343a40;}
  .genre-スポーツクラシック{background:#ffec99;color:#7a4a00;}
  .card-select{
    position:absolute;
    top:10px;
    left:10px;
    width:20px;
    height:20px;
    accent-color:var(--accent);
    cursor:pointer;
  }
  .card-image{position:relative;}
  .bulk-bar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:16px;
  }
  .bulk-bar .selected-count{color:var(--sub);font-size:14px;}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  .card-price{color:var(--price);font-weight:900;font-size:15px;margin:0 0 12px;}
  .card-actions{display:flex;gap:8px;}
  .card-actions button{flex:1;padding:8px 10px;}
  .empty{
    display:none;
    text-align:center;
    color:var(--sub);
    background:#fff;
    border:3px dashed var(--line);
    border-radius:20px;
    padding:48px 20px;
  }
  .empty.show{display:block;}
  .empty p{margin:0 0 16px;}
  /* モーダル */
  .modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    align-items:center;
    justify-content:center;
    padding:16px;
    z-index:10;
    overflow-y:auto;
  }
  .modal.show{display:flex;}
  .modal-panel{
    background:#fff;
    border:3px solid var(--ink);
    border-radius:20px;
    width:100%;
    max-width:480px;
    padding:20px;
    box-shadow:0 8px 0 rgba(51,35,46,.9);
    max-height:calc(100dvh - 32px);
    overflow-y:auto;
  }
  .modal-panel h2{margin:0 0 16px;font-size:18px;}
  .modal-panel label{display:block;font-size:14px;margin:0 0 6px;}
  .modal-panel input[type="text"], .modal-panel input[type="number"], .modal-panel input[type="password"], .modal-panel select{
    width:100%;
    background:#fff;
    color:var(--text);
    border:2px solid var(--ink);
    border-radius:12px;
    padding:10px 12px;
    font-size:14px;
    font-family:inherit;
    font-weight:700;
    margin-bottom:14px;
    outline:none;
  }
  .modal-panel input[type="file"]{margin-bottom:8px;}
  .preview{max-width:100%;max-height:180px;display:none;margin:8px 0 14px;border-radius:8px;}
  .preview.show{display:block;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;position:sticky;bottom:0;background:#fff;padding:10px 0 2px;}
  .modal-actions button{flex:1;padding:13px 16px;font-size:15px;}
  .error{color:#ff9a94;font-size:13px;margin:0 0 12px;display:none;}
  .error.show{display:block;}
</style>
</head>
<body>
<header>
  <div class="hero">
    <div class="hero-text">
      <span class="hero-tag">LOS SANTOS GARAGE</span>
      <h1>FiveM車両ダッシュボード</h1>
      <p class="subtitle">★ かわいい車両ぜんぶ集めたよ ★</p>
    </div>
    <img class="hero-mascot" src="karu.jpg" alt="かるちゃん">
  </div>
  <div id="local-banner" class="banner">ローカル確認モードで表示しています。Supabaseに接続されていません。</div>
  <div class="toolbar">
    <input type="search" id="search-input" placeholder="車両名で検索" aria-label="車両名で検索">
    <select id="category-filter" aria-label="カテゴリーで絞り込み">
      <option value="全般">全般</option>
      <option value="車">車</option>
      <option value="バイク">バイク</option>
      <option value="ヘリ">ヘリ</option>
      <option value="飛行機">飛行機</option>
      <option value="船">船</option>
    </select>
    <select id="subcategory-filter" aria-label="分類で絞り込み">
      <option value="全般">分類：全般</option>
      <option value="バニラ車">バニラ車</option>
      <option value="カーディーラー">カーディーラー</option>
      <option value="高級車">高級車</option>
    </select>
    <select id="genre-filter" aria-label="ジャンルで絞り込み">
      <option value="全般">ジャンル：全般</option>
      <option value="コンパクト">コンパクト</option>
      <option value="セダン">セダン</option>
      <option value="バイク">バイク</option>
      <option value="オフロード">オフロード</option>
      <option value="バン">バン</option>
      <option value="ネタ車両">ネタ車両</option>
      <option value="スポーツ">スポーツ</option>
      <option value="サイクル">サイクル</option>
      <option value="スーパーカー">スーパーカー</option>
      <option value="マッスルカー">マッスルカー</option>
      <option value="SUV">SUV</option>
      <option value="トラック">トラック</option>
      <option value="スポーツクラシック">スポーツクラシック</option>
    </select>
    <select id="sort-select" aria-label="並び替え">
      <option value="new">新着順</option>
      <option value="price-desc">価格が高い順</option>
      <option value="price-asc">価格が安い順</option>
      <option value="name">名前順</option>
    </select>
    <button id="add-button" class="btn-primary" type="button">車両を登録</button>
  </div>
  <div class="bulk-bar">
    <button id="select-all-button" class="btn-secondary" type="button">全て選択</button>
    <button id="bulk-delete-button" class="btn-danger" type="button" disabled>選択したものを削除</button>
    <span class="selected-count" id="selected-count"></span>
  </div>
  <p class="count">総台数: <span id="total-count">0</span>台</p>
</header>
<main>
  <div id="empty-state" class="empty">
    <p>まだ車両が登録されていません。「車両を登録」から追加してみましょう。</p>
    <button id="empty-add-button" class="btn-primary" type="button">車両を登録</button>
  </div>
  <div id="vehicle-grid" class="grid"></div>
</main>

<div id="vehicle-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-panel">
    <h2 id="modal-title">車両を登録</h2>
    <p id="form-error" class="error"></p>
    <form id="vehicle-form">
      <label for="vehicle-name">車両名（必須）</label>
      <input type="text" id="vehicle-name" required maxlength="100" placeholder="例：Adder">
      <label for="vehicle-category">カテゴリー</label>
      <select id="vehicle-category">
        <option value="車">車</option>
        <option value="バイク">バイク</option>
        <option value="ヘリ">ヘリ</option>
        <option value="飛行機">飛行機</option>
        <option value="船">船</option>
      </select>
      <label for="vehicle-subcategory">分類</label>
      <select id="vehicle-subcategory">
        <option value="">選択なし</option>
        <option value="バニラ車">バニラ車</option>
        <option value="カーディーラー">カーディーラー</option>
        <option value="高級車">高級車</option>
      </select>
      <label for="vehicle-genre">ジャンル</label>
      <select id="vehicle-genre">
        <option value="">選択なし</option>
        <option value="コンパクト">コンパクト</option>
        <option value="セダン">セダン</option>
        <option value="バイク">バイク</option>
        <option value="オフロード">オフロード</option>
        <option value="バン">バン</option>
        <option value="ネタ車両">ネタ車両</option>
        <option value="スポーツ">スポーツ</option>
        <option value="サイクル">サイクル</option>
        <option value="スーパーカー">スーパーカー</option>
        <option value="マッスルカー">マッスルカー</option>
        <option value="SUV">SUV</option>
        <option value="トラック">トラック</option>
        <option value="スポーツクラシック">スポーツクラシック</option>
      </select>
      <label for="vehicle-price">価格（任意）</label>
      <input type="number" id="vehicle-price" min="0" step="1" placeholder="例：1000000">
      <label for="vehicle-image">画像（任意）</label>
      <input type="file" id="vehicle-image" accept="image/*">
      <img id="image-preview" class="preview" alt="画像プレビュー">
      <label for="vehicle-image2">画像2（任意）</label>
      <input type="file" id="vehicle-image2" accept="image/*">
      <img id="image2-preview" class="preview" alt="画像2プレビュー">
      <div class="modal-actions">
        <button type="button" id="cancel-button" class="btn-secondary">キャンセル</button>
        <button type="submit" class="btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div id="detail-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="detail-name">
  <div class="modal-panel detail-panel">
    <div id="detail-image" class="detail-image"></div>
    <div id="detail-image2" class="detail-image" style="display:none"></div>
    <span id="detail-category" class="category-badge"></span>
    <span id="detail-subcategory" class="category-badge" style="display:none"></span>
    <span id="detail-genre" class="category-badge" style="display:none"></span>
    <h2 id="detail-name" class="detail-name"></h2>
    <p id="detail-price" class="detail-price"></p>
    <div class="modal-actions">
      <button type="button" id="detail-close-button" class="btn-secondary">閉じる</button>
    </div>
  </div>
</div>

<div id="delete-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-title">
  <div class="modal-panel">
    <h2 id="delete-title">車両を削除</h2>
    <p id="delete-message" style="margin:0 0 16px;color:var(--sub);font-size:14px;"></p>
    <p id="delete-error" class="error"></p>
    <label for="delete-password" style="display:block;font-size:14px;margin:0 0 6px;">削除用パスワード</label>
    <input type="password" id="delete-password" placeholder="パスワードを入力" autocomplete="off">
    <div class="modal-actions">
      <button type="button" id="delete-cancel-button" class="btn-secondary">キャンセル</button>
      <button type="button" id="delete-confirm-button" class="btn-danger">削除する</button>
    </div>
  </div>
</div>

<script>
  // ---- 設定とモード判定 ----
  var config = window.DASHBOARD_CONFIG || {};
  var supabaseUrl = (config.SUPABASE_URL || "").trim();
  var supabaseAnonKey = (config.SUPABASE_ANON_KEY || "").trim();
  var isSharedMode = Boolean(supabaseUrl && supabaseAnonKey);
  var supabaseClient = null;
  if (isSharedMode) {
    supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
  }

  var LOCAL_KEY = "fivem-vehicles-local";
  var CATEGORIES = ["車", "バイク", "ヘリ", "飛行機", "船"];
  // 2つ目の分類（車の種類とは別）。"" は「分類なし」。
  var SUB_CATEGORIES = ["", "バニラ車", "カーディーラー", "高級車"];
  // 3つ目の分類（ジャンル）。"" は「ジャンルなし」。
  var GENRES = ["", "コンパクト", "セダン", "バイク", "オフロード", "バン", "ネタ車両", "スポーツ", "サイクル", "スーパーカー", "マッスルカー", "SUV", "トラック", "スポーツクラシック"];
  // 削除用パスワードはデータベース側に置きます（app_settings テーブル）。
  // 共有モードでは check_delete_password という DB 関数に照合を任せるため、
  // 本物のパスワードはブラウザには届かず、ページのソースにも載りません。
  // ローカル確認モード（DBなし）では、そのブラウザの localStorage に保存した
  // パスワードと照合します。まだ保存がない場合、最初に入力したものが
  // そのブラウザの削除用パスワードになります。
  var LOCAL_PASSWORD_KEY = "fivem-delete-password";
  async function checkDeletePassword(pw) {
    if (isSharedMode) {
      var res = await supabaseClient.rpc("check_delete_password", { p: pw });
      if (res.error) { console.error(res.error); return false; }
      return res.data === true;
    }
    var saved = null;
    try { saved = localStorage.getItem(LOCAL_PASSWORD_KEY); } catch (e) { saved = null; }
    if (saved === null) {
      try { localStorage.setItem(LOCAL_PASSWORD_KEY, pw); } catch (e) {}
      return pw !== "";
    }
    return pw === saved;
  }
  var vehicles = [];
  var searchQuery = "";
  var categoryFilter = "全般";
  var subCategoryFilter = "全般";
  var genreFilter = "全般";
  var sortOrder = "new";
  var selectedIds = {};
  var editingImageUrl = "";
  var newImageDataUrl = "";

  function normalizeCategory(v) {
    var c = v && v.category;
    return CATEGORIES.indexOf(c) !== -1 ? c : "車";
  }

  function normalizeSubCategory(v) {
    var c = v && v.sub_category;
    return SUB_CATEGORIES.indexOf(c) !== -1 ? c : "";
  }

  function normalizeGenre(v) {
    var c = v && v.genre;
    return GENRES.indexOf(c) !== -1 ? c : "";
  }

  var gridEl = document.getElementById("vehicle-grid");
  var emptyEl = document.getElementById("empty-state");
  var totalEl = document.getElementById("total-count");
  var bannerEl = document.getElementById("local-banner");
  var searchEl = document.getElementById("search-input");
  var sortEl = document.getElementById("sort-select");
  var modalEl = document.getElementById("vehicle-modal");
  var formEl = document.getElementById("vehicle-form");
  var errorEl = document.getElementById("form-error");

  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function formatPrice(price) {
    if (price === null || price === undefined || price === "") return "価格なし";
    var n = Number(price);
    if (Number.isNaN(n)) return "価格なし";
    return "€" + n.toLocaleString("en-US");
  }

  // ---- ローカル確認モード ----
  function loadLocalVehicles() {
    try {
      var raw = localStorage.getItem(LOCAL_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }
  function saveLocalVehicles(list) {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(list));
  }

  // ---- データ取得 ----
  async function loadVehicles() {
    if (isSharedMode) {
      var result = await supabaseClient
        .from("vehicles")
        .select("*")
        .order("created_at", { ascending: false });
      if (result.error) {
        console.error(result.error);
        alert("車両の読み込みに失敗しました。");
        return;
      }
      vehicles = result.data || [];
    } else {
      vehicles = loadLocalVehicles();
    }
    renderVehicles();
  }

  // ---- 表示 ----
  function getFilteredSortedVehicles() {
    var q = searchQuery.trim().toLowerCase();
    var list = vehicles.filter(function (v) {
      if (categoryFilter !== "全般" && normalizeCategory(v) !== categoryFilter) return false;
      if (subCategoryFilter !== "全般" && normalizeSubCategory(v) !== subCategoryFilter) return false;
      if (genreFilter !== "全般" && normalizeGenre(v) !== genreFilter) return false;
      if (!q) return true;
      return String(v.name || "").toLowerCase().indexOf(q) !== -1;
    });
    list = list.slice();
    if (sortOrder === "price-desc") {
      list.sort(function (a, b) { return (b.price == null ? -1 : b.price) - (a.price == null ? -1 : a.price); });
    } else if (sortOrder === "price-asc") {
      list.sort(function (a, b) { return (a.price == null ? Infinity : a.price) - (b.price == null ? Infinity : b.price); });
    } else if (sortOrder === "name") {
      list.sort(function (a, b) { return String(a.name || "").localeCompare(String(b.name || ""), "ja"); });
    } else {
      // 新着順: created_at 降順
      list.sort(function (a, b) { return new Date(b.created_at || 0) - new Date(a.created_at || 0); });
    }
    return list;
  }

  function renderVehicles() {
    var list = getFilteredSortedVehicles();
    totalEl.textContent = String(vehicles.length);
    emptyEl.classList.toggle("show", list.length === 0);
    var selectedCount = Object.keys(selectedIds).filter(function (id) {
      return selectedIds[id] && vehicles.some(function (v) { return String(v.id) === String(id); });
    }).length;
    var bulkBtn = document.getElementById("bulk-delete-button");
    bulkBtn.disabled = selectedCount === 0;
    bulkBtn.textContent = "選択したものを削除" + (selectedCount ? " (" + selectedCount + "台)" : "");
    document.getElementById("selected-count").textContent = selectedCount ? selectedCount + "台選択中" : "";
    var allVisibleSelected = list.length > 0 && list.every(function (v) { return selectedIds[v.id]; });
    document.getElementById("select-all-button").textContent = allVisibleSelected ? "選択を解除" : "全て選択";
    gridEl.innerHTML = list.map(function (v) {
      var imageHtml = v.image_url
        ? '<img src="' + escapeHtml(v.image_url) + '" alt="">'
        : '<span class="no-image">画像なし</span>';
      var checked = selectedIds[v.id] ? ' checked' : '';
      var subBadge = "";
      var sub = normalizeSubCategory(v);
      if (sub) {
        subBadge = ' <span class="category-badge cat-' + escapeHtml(sub) + '">' + escapeHtml(sub) + '</span>';
      }
      var genreBadge = "";
      var genre = normalizeGenre(v);
      if (genre) {
        genreBadge = ' <span class="category-badge genre-' + escapeHtml(genre) + '">' + escapeHtml(genre) + '</span>';
      }
      return '<article class="card" data-id="' + escapeHtml(v.id) + '">' +
        '<div class="card-image">' + imageHtml +
          '<input type="checkbox" class="card-select" data-id="' + escapeHtml(v.id) + '"' + checked + ' aria-label="選択">' +
        '</div>' +
        '<div class="card-body">' +
          '<span class="category-badge cat-' + escapeHtml(normalizeCategory(v)) + '">' + escapeHtml(normalizeCategory(v)) + '</span>' + subBadge + genreBadge +
          '<h3 class="card-name">' + escapeHtml(v.name) + '</h3>' +
          '<p class="card-price">' + escapeHtml(formatPrice(v.price)) + '</p>' +
          '<div class="card-actions">' +
            '<button type="button" class="btn-danger" data-action="delete" data-id="' + escapeHtml(v.id) + '">削除</button>' +
          '</div>' +
        '</div>' +
      '</article>';
    }).join("");
  }

  // ---- モーダル（登録のみ。編集機能はありません） ----
  function openModal() {
    errorEl.classList.remove("show");
    errorEl.textContent = "";
    newImageDataUrl = "";
    var preview = document.getElementById("image-preview");
    preview.classList.remove("show");
    preview.src = "";
    var preview2 = document.getElementById("image2-preview");
    preview2.classList.remove("show");
    preview2.src = "";
    formEl.reset();
    document.getElementById("modal-title").textContent = "車両を登録";
    document.getElementById("vehicle-category").value = "車";
    document.getElementById("vehicle-subcategory").value = "";
    document.getElementById("vehicle-genre").value = "";
    editingImageUrl = "";
    modalEl.classList.add("show");
  }
  function closeModal() {
    modalEl.classList.remove("show");
  }

  // ---- 詳細表示（カードをクリックすると大きく表示） ----
  var detailModalEl = document.getElementById("detail-modal");
  function openDetailModal(vehicle) {
    var imageEl = document.getElementById("detail-image");
    if (vehicle.image_url) {
      imageEl.innerHTML = '<img src="' + escapeHtml(vehicle.image_url) + '" alt="">';
    } else {
      imageEl.innerHTML = '<span class="no-image">画像なし</span>';
    }
    var image2El = document.getElementById("detail-image2");
    if (vehicle.image2_url) {
      image2El.innerHTML = '<img src="' + escapeHtml(vehicle.image2_url) + '" alt="">';
      image2El.style.display = "";
    } else {
      image2El.innerHTML = "";
      image2El.style.display = "none";
    }
    var detailBadge = document.getElementById("detail-category");
    detailBadge.className = "category-badge cat-" + normalizeCategory(vehicle);
    detailBadge.textContent = normalizeCategory(vehicle);
    var detailSubBadge = document.getElementById("detail-subcategory");
    var sub = normalizeSubCategory(vehicle);
    detailSubBadge.className = "category-badge cat-" + sub;
    detailSubBadge.textContent = sub;
    detailSubBadge.style.display = sub ? "" : "none";
    var detailGenreBadge = document.getElementById("detail-genre");
    var genreVal = normalizeGenre(vehicle);
    detailGenreBadge.className = "category-badge genre-" + genreVal;
    detailGenreBadge.textContent = genreVal;
    detailGenreBadge.style.display = genreVal ? "" : "none";
    document.getElementById("detail-name").textContent = vehicle.name || "";
    document.getElementById("detail-price").textContent = formatPrice(vehicle.price);
    detailModalEl.classList.add("show");
  }
  function closeDetailModal() {
    detailModalEl.classList.remove("show");
  }
  document.getElementById("detail-close-button").addEventListener("click", closeDetailModal);
  detailModalEl.addEventListener("click", function (e) { if (e.target === detailModalEl) closeDetailModal(); });

  // ---- 画像アップロード ----
  function readFileAsDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result); };
      reader.onerror = function () { reject(reader.error); };
      reader.readAsDataURL(file);
    });
  }

  async function uploadSharedImage(file) {
    var ext = (file.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "") || "png";
    var uniqueName = Date.now() + "-" + Math.random().toString(36).slice(2, 10) + "." + ext;
    var up = await supabaseClient.storage.from("vehicle-images").upload(uniqueName, file);
    if (up.error) throw up.error;
    var pub = supabaseClient.storage.from("vehicle-images").getPublicUrl(uniqueName);
    return pub.data.publicUrl;
  }

  // ---- 保存 / 削除 ----
  formEl.addEventListener("submit", async function (e) {
    e.preventDefault();
    var name = document.getElementById("vehicle-name").value.trim();
    var category = document.getElementById("vehicle-category").value;
    if (CATEGORIES.indexOf(category) === -1) category = "車";
    var subCategory = document.getElementById("vehicle-subcategory").value;
    if (SUB_CATEGORIES.indexOf(subCategory) === -1) subCategory = "";
    var genre = document.getElementById("vehicle-genre").value;
    if (GENRES.indexOf(genre) === -1) genre = "";
    var priceRaw = document.getElementById("vehicle-price").value;
    var file = document.getElementById("vehicle-image").files[0];
    var file2 = document.getElementById("vehicle-image2").files[0];
    if (!name) {
      errorEl.textContent = "車両名を入力してください。";
      errorEl.classList.add("show");
      return;
    }
    var price = priceRaw === "" ? null : Number(priceRaw);
    try {
      var imageUrl = editingImageUrl || null;
      if (file) {
        if (isSharedMode) {
          imageUrl = await uploadSharedImage(file);
        } else {
          imageUrl = await readFileAsDataUrl(file);
        }
      }
      var image2Url = null;
      if (file2) {
        if (isSharedMode) {
          image2Url = await uploadSharedImage(file2);
        } else {
          image2Url = await readFileAsDataUrl(file2);
        }
      }
      if (isSharedMode) {
        var ins = await supabaseClient.from("vehicles").insert({ name: name, category: category, sub_category: subCategory, genre: genre, price: price, image_url: imageUrl, image2_url: image2Url });
        if (ins.error) throw ins.error;
      } else {
        vehicles.unshift({
          id: "local-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8),
          name: name,
          category: category,
          sub_category: subCategory,
          genre: genre,
          price: price,
          image_url: imageUrl,
          image2_url: image2Url,
          created_at: new Date().toISOString()
        });
        saveLocalVehicles(vehicles);
      }
      closeModal();
      await loadVehicles();
    } catch (err) {
      console.error(err);
      errorEl.textContent = "保存に失敗しました。もう一度お試しください。";
      errorEl.classList.add("show");
    }
  });

  gridEl.addEventListener("click", async function (e) {
    var btn = e.target.closest("button[data-action]");
    var card = e.target.closest(".card");
    if (!card) return;
    var id = card.getAttribute("data-id");
    var vehicle = vehicles.find(function (v) { return String(v.id) === String(id); });
    if (!vehicle) return;
    if (btn && btn.getAttribute("data-action") === "delete") {
      openDeleteModal([vehicle]);
      return;
    }
    if (btn) return;
    // チェックボックスまわりは詳細を開かない
    if (e.target.closest('input[type="checkbox"]')) return;
    // カード本体のクリックで詳細を大きく表示
    openDetailModal(vehicle);
  });

  // カードのチェックボックス（一括削除の選択）
  gridEl.addEventListener("change", function (e) {
    var box = e.target.closest(".card-select");
    if (!box) return;
    var id = box.getAttribute("data-id");
    if (box.checked) { selectedIds[id] = true; }
    else { delete selectedIds[id]; }
    renderVehicles();
  });

  // ---- カテゴリー絞り込み・一括選択・一括削除 ----
  document.getElementById("category-filter").addEventListener("change", function (e) {
    categoryFilter = e.target.value;
    renderVehicles();
  });
  document.getElementById("subcategory-filter").addEventListener("change", function (e) {
    subCategoryFilter = e.target.value;
    renderVehicles();
  });
  document.getElementById("genre-filter").addEventListener("change", function (e) {
    genreFilter = e.target.value;
    renderVehicles();
  });
  document.getElementById("select-all-button").addEventListener("click", function () {
    var list = getFilteredSortedVehicles();
    var allSelected = list.length > 0 && list.every(function (v) { return selectedIds[v.id]; });
    list.forEach(function (v) {
      if (allSelected) { delete selectedIds[v.id]; }
      else { selectedIds[v.id] = true; }
    });
    renderVehicles();
  });
  document.getElementById("bulk-delete-button").addEventListener("click", function () {
    var list = vehicles.filter(function (v) { return selectedIds[v.id]; });
    if (!list.length) return;
    openDeleteModal(list);
  });

  // ---- 削除確認モーダル（ブラウザ標準の確認ダイアログの代わり。
  //      自動ブラウザなどで標準ダイアログが表示されない環境でも削除できるようにするため） ----
  //      個別削除・一括削除のどちらも、削除用パスワードが合わないと削除できません。
  var deleteModalEl = document.getElementById("delete-modal");
  var pendingDeleteVehicles = [];
  function openDeleteModal(list) {
    pendingDeleteVehicles = list.slice();
    var errorEl2 = document.getElementById("delete-error");
    errorEl2.classList.remove("show");
    errorEl2.textContent = "";
    document.getElementById("delete-password").value = "";
    if (list.length === 1) {
      document.getElementById("delete-message").textContent = "「" + list[0].name + "」を削除しますか？この操作は取り消せません。";
    } else {
      document.getElementById("delete-message").textContent = "選択した " + list.length + "台をまとめて削除しますか？この操作は取り消せません。";
    }
    deleteModalEl.classList.add("show");
  }
  function closeDeleteModal() {
    deleteModalEl.classList.remove("show");
    pendingDeleteVehicles = [];
  }
  async function deleteVehicles(list) {
    var ids = list.map(function (v) { return v.id; });
    try {
      if (isSharedMode) {
        var del = await supabaseClient.from("vehicles").delete().in("id", ids);
        if (del.error) throw del.error;
        // 画像ファイルの削除はベストエフォート（失敗しても一覧の削除は完了扱い）
        var paths = [];
        list.forEach(function (v) {
          [v.image_url, v.image2_url].forEach(function (u) {
            if (u && u.indexOf("vehicle-images") !== -1) {
              var p = decodeURIComponent(u.split("/vehicle-images/")[1] || "");
              if (p) paths.push(p);
            }
          });
        });
        if (paths.length) {
          try { await supabaseClient.storage.from("vehicle-images").remove(paths); }
          catch (imgErr) { console.warn(imgErr); }
        }
      } else {
        vehicles = vehicles.filter(function (v) { return ids.indexOf(v.id) === -1; });
        saveLocalVehicles(vehicles);
      }
      ids.forEach(function (id) { delete selectedIds[id]; });
      await loadVehicles();
    } catch (err) {
      console.error(err);
      alert("削除に失敗しました。");
    }
  }
  document.getElementById("delete-confirm-button").addEventListener("click", async function () {
    if (!pendingDeleteVehicles.length) return;
    var pw = document.getElementById("delete-password").value;
    var errEl = document.getElementById("delete-error");
    if (!pw) {
      errEl.textContent = "パスワードを入力してください。";
      errEl.classList.add("show");
      return;
    }
    var ok = await checkDeletePassword(pw);
    if (!ok) {
      errEl.textContent = "パスワードが違います。";
      errEl.classList.add("show");
      return;
    }
    var list = pendingDeleteVehicles;
    closeDeleteModal();
    await deleteVehicles(list);
  });
  document.getElementById("delete-cancel-button").addEventListener("click", closeDeleteModal);
  deleteModalEl.addEventListener("click", function (e) { if (e.target === deleteModalEl) closeDeleteModal(); });

  // ---- イベント ----
  document.getElementById("add-button").addEventListener("click", function () { openModal(); });
  document.getElementById("empty-add-button").addEventListener("click", function () { openModal(); });
  document.getElementById("cancel-button").addEventListener("click", closeModal);
  modalEl.addEventListener("click", function (e) { if (e.target === modalEl) closeModal(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeModal(); closeDetailModal(); closeDeleteModal(); }
  });
  searchEl.addEventListener("input", function () { searchQuery = searchEl.value; renderVehicles(); });
  sortEl.addEventListener("change", function () { sortOrder = sortEl.value; renderVehicles(); });
  document.getElementById("vehicle-image2").addEventListener("change", async function (e) {
    var file = e.target.files[0];
    var preview = document.getElementById("image2-preview");
    if (!file) { preview.classList.remove("show"); preview.src = ""; return; }
    preview.src = await readFileAsDataUrl(file);
    preview.classList.add("show");
  });
  document.getElementById("vehicle-image").addEventListener("change", async function (e) {
    var file = e.target.files[0];
    var preview = document.getElementById("image-preview");
    if (!file) { preview.classList.remove("show"); preview.src = ""; return; }
    if (isSharedMode) {
      // 共有モードでは保存時にアップロードするため、ここではプレビュー用に Data URL を作るだけ
      newImageDataUrl = await readFileAsDataUrl(file);
      preview.src = newImageDataUrl;
      preview.classList.add("show");
    } else {
      newImageDataUrl = await readFileAsDataUrl(file);
      preview.src = newImageDataUrl;
      preview.classList.add("show");
    }
  });

  // ---- 初期化 ----
  if (!isSharedMode) {
    bannerEl.classList.add("show");
  } else {
    // Realtime: 変更があったら一覧を再読み込みする
    supabaseClient
      .channel("vehicles-realtime")
      .on("postgres_changes", { event: "*", schema: "public", table: "vehicles" }, function () { loadVehicles(); })
      .subscribe();
  }
  loadVehicles();
</script>
</body>
</html>
